name: Cloudflare Pages Deploy

on:
  push:
  workflow_dispatch:

jobs:
  check:
    uses: ./.github/workflows/check.yml
  build:
    runs-on: ubuntu-latest
    needs: check
    environment:
      name: ${{ (github.ref == 'refs/heads/release' && 'prod') || 'stg' }}
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    env:
      MODE: ${{ (github.ref == 'refs/heads/release' && 'prod') || 'stg' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
      - name: 📸 Calculate commit hash
        id: sha
        uses: prompt/actions-commit-hash@v4
      - name: 🔨 Prepare dev environment
        uses: jdx/mise-action@v5.2.1
        with:
          bootstrap: true
      - name: 🚀 Deploy to Cloudflare Workers
        run: ${{ env.MODE == 'prod' && 'cf deploy' || 'cf previews deploy stg' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
